services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: spacey
      POSTGRES_PASSWORD: spacey
      POSTGRES_DB: spacey
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spacey -d spacey"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      APP_REVISION: compose
      DATABASE_URL: postgresql://spacey:spacey@db:5432/spacey
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
