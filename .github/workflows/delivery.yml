name: test-build-deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spacey
          POSTGRES_PASSWORD: spacey
          POSTGRES_DB: spacey
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U spacey"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest
        env:
          DATABASE_URL: postgresql://spacey:spacey@localhost:5432/spacey

  build-and-deploy:
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    needs: test
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}

      - uses: hashicorp/setup-nomad@main

      - name: Deploy the tested revision
        env:
          NOMAD_ADDR: ${{ secrets.NOMAD_ADDR }}
          NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
        run: >-
          nomad job run
          -var="image=${IMAGE}"
          -var="hostname=${{ vars.APP_HOSTNAME }}"
          -var="revision=${{ github.sha }}"
          deploy/startup-app.nomad.hcl
