name: test-build-deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spacey
          POSTGRES_PASSWORD: spacey
          POSTGRES_DB: spacey
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U spacey"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest
        env:
          DATABASE_URL: postgresql://spacey:spacey@localhost:5432/spacey

  build:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}

  deploy:
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: spacey-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-nomad@main

      - name: Confirm this is still the current main revision
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_revision="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "${current_revision}" = "${GITHUB_SHA}" ]; then
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
          else
            echo "deploy=false" >> "${GITHUB_OUTPUT}"
            echo "Skipping superseded revision ${GITHUB_SHA}"
          fi

      - name: Deploy the tested revision
        if: steps.freshness.outputs.deploy == 'true'
        env:
          NOMAD_ADDR: ${{ secrets.NOMAD_ADDR }}
          NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
        run: >-
          nomad job run
          -detach
          -namespace=startup
          -var="image=${IMAGE}"
          -var="hostname=${{ vars.APP_HOSTNAME }}"
          -var="revision=${{ github.sha }}"
          deploy/startup-app.nomad.hcl

      - name: Verify the deployed revision
        if: steps.freshness.outputs.deploy == 'true'
        env:
          APP_URL: https://${{ vars.APP_HOSTNAME }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          for attempt in {1..36}; do
            actual_revision="$(curl --fail --silent --show-error "${APP_URL}/health" | jq --raw-output '.revision' 2>/dev/null || true)"
            if [ "${actual_revision}" = "${EXPECTED_REVISION}" ]; then
              exit 0
            fi
            sleep 5
          done

          echo "Timed out waiting for the expected revision" >&2
          exit 1
